services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=td7
    volumes:
      - ./api/src:/app/src
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8.0
    environment:
      - MONGO_INITDB_DATABASE=td7
    volumes:
      - mongodb_data:/data/db
  redis:
    image: redis:alpine
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./frontend/src:/app/src
  reverseproxy:
      restart: always
      build:
        context: reverse-proxy/
        dockerfile: ./Dockerfile.dev
      depends_on:
        - api
        - frontend
      volumes:
        - ./reverse-proxy/log:/var/log/nginx
      ports:
        - 80:80
volumes:
  mongodb_data: